<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>日报管理系统</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#202538;background:#f6f7fb;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;min-width:320px}.shell{max-width:1180px;margin:0 auto;padding:36px 24px 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:13px}.logo{width:44px;height:44px;border-radius:14px;background:#645bdf;color:white;display:grid;place-items:center;font-size:23px;box-shadow:0 7px 18px #645bdf40}.brand h1{font-size:21px;margin:0 0 4px;letter-spacing:.2px}.brand p{margin:0;color:#7b8194;font-size:13px}.actions{display:flex;gap:10px}.button{border:0;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:.18s}.button:hover{transform:translateY(-1px)}.primary{background:#645bdf;color:#fff;box-shadow:0 5px 12px #645bdf35}.secondary{background:#fff;color:#50566b;border:1px solid #e6e8f0}.danger{background:#fff1f0;color:#c44d48;border:1px solid #ffe0dd}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}.stat,.panel{background:#fff;border:1px solid #eceef4;border-radius:15px;box-shadow:0 4px 16px #22243a06}.stat{padding:18px 20px;display:flex;justify-content:space-between;align-items:center}.stat-label{color:#7b8194;font-size:13px;margin-bottom:8px}.stat-value{font-size:27px;font-weight:700;letter-spacing:-.7px}.stat-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#f0efff}.stat:nth-child(2) .stat-icon{background:#e8f8f2}.stat:nth-child(3) .stat-icon{background:#fff4e5}.panel{padding:20px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.toolbar h2{font-size:16px;margin:0}.filters{display:flex;gap:9px;align-items:center}.input,.select{border:1px solid #e4e6ee;border-radius:9px;background:#fff;padding:10px 12px;color:#30364a;font:inherit;font-size:13px;outline:none}.input:focus,.select:focus,textarea:focus{border-color:#8b84ed;box-shadow:0 0 0 3px #645bdf18}.search{width:220px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;min-width:700px}th{font-size:12px;color:#858b9d;font-weight:600;background:#fafafe;padding:12px 14px}td{padding:15px 14px;border-bottom:1px solid #f0f1f5;font-size:13px;vertical-align:middle}tbody tr:last-child td{border-bottom:0}.report-title{font-weight:600;color:#30364a;margin-bottom:5px}.report-preview{color:#969bad;max-width:390px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.date-cell{white-space:nowrap;color:#62697d}.tag{display:inline-flex;align-items:center;padding:5px 9px;border-radius:20px;font-size:12px;background:#f0efff;color:#6258d1}.tag.submitted{background:#e8f8f2;color:#21845f}.row-actions{display:flex;gap:7px}.text-button{border:0;background:none;color:#645bdf;font:inherit;font-size:12px;padding:4px;cursor:pointer}.text-button.delete{color:#c44d48}.empty{text-align:center;padding:48px 20px;color:#858b9d}.empty-icon{font-size:34px;margin-bottom:10px}.empty strong{display:block;color:#4e5569;margin-bottom:5px}.modal-backdrop{position:fixed;inset:0;background:#17192b80;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal-backdrop.open{display:flex}.modal{width:min(560px,100%);background:#fff;border-radius:16px;padding:24px;box-shadow:0 20px 60px #10122540;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{font-size:18px;margin:0}.close{border:0;background:#f2f3f8;border-radius:8px;width:32px;height:32px;font-size:18px;cursor:pointer;color:#70768a}.field{margin-bottom:16px}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:#454b60}.field input,.field textarea{width:100%;border:1px solid #e4e6ee;border-radius:9px;padding:11px 12px;font:inherit;font-size:14px;outline:none}.field textarea{min-height:110px;resize:vertical}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:13px}.modal-footer{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#25283a;color:white;padding:11px 16px;border-radius:9px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:680px){.shell{padding:24px 14px 40px}.topbar{align-items:flex-start}.brand p{max-width:190px;line-height:1.5}.actions{flex-direction:column}.button{padding:10px 12px}.stats{gap:9px}.stat{padding:13px 10px;display:block}.stat-label{font-size:11px}.stat-value{font-size:23px}.stat-icon{display:none}.toolbar{align-items:flex-start;flex-direction:column}.filters{width:100%;flex-wrap:wrap}.search{width:100%;flex:1}.select{flex:1}.panel{padding:14px}.field-row{grid-template-columns:1fr;gap:0}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><div class="logo" aria-hidden="true">▤</div><div><h1>日报管理系统</h1><p>记录每日进展，让工作井井有条</p></div></div>
      <div class="actions"><button class="button secondary" id="exportBtn" type="button">导出数据</button><button class="button primary" id="newBtn" type="button">＋ 新建日报</button></div>
    </header>
    <section class="stats" aria-label="日报统计">
      <article class="stat"><div><div class="stat-label">日报总数</div><div class="stat-value" id="totalCount">0</div></div><div class="stat-icon" aria-hidden="true">📝</div></article>
      <article class="stat"><div><div class="stat-label">本周已提交</div><div class="stat-value" id="weekCount">0</div></div><div class="stat-icon" aria-hidden="true">✅</div></article>
      <article class="stat"><div><div class="stat-label">最近一次提交</div><div class="stat-value" id="latestDate" style="font-size:18px">—</div></div><div class="stat-icon" aria-hidden="true">📅</div></article>
    </section>
    <section class="panel">
      <div class="toolbar"><h2>日报记录</h2><div class="filters"><input id="searchInput" class="input search" type="search" placeholder="搜索标题或内容…" aria-label="搜索日报"><select id="statusFilter" class="select" aria-label="按状态筛选"><option value="all">全部状态</option><option value="submitted">已提交</option><option value="draft">草稿</option></select><input id="dateFilter" class="input" type="date" aria-label="按日期筛选"></div></div>
      <div class="table-wrap"><table><thead><tr><th>标题 / 内容摘要</th><th>日期</th><th>状态</th><th>操作</th></tr></thead><tbody id="reportRows"></tbody></table><div class="empty" id="emptyState" hidden><div class="empty-icon">📭</div><strong>还没有日报记录</strong><span>新建一条日报，记录今天的工作进展吧。</span></div></div>
    </section>
  </main>
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <form class="modal" id="reportForm"><div class="modal-head"><h2 id="modalTitle">新建日报</h2><button class="close" id="closeModal" type="button" aria-label="关闭">×</button></div><input type="hidden" id="reportId"><div class="field"><label for="titleInput">日报标题</label><input id="titleInput" required maxlength="80" placeholder="例如：产品开发周三进展"></div><div class="field-row"><div class="field"><label for="dateInput">日报日期</label><input id="dateInput" type="date" required></div><div class="field"><label for="statusInput">状态</label><select id="statusInput" class="select" style="width:100%"><option value="submitted">已提交</option><option value="draft">草稿</option></select></div></div><div class="field"><label for="contentInput">今日工��内容</label><textarea id="contentInput" required placeholder="完成了什么工作？"></textarea></div><div class="field"><label for="planInput">明日计划（选填）</label><textarea id="planInput" placeholder="下一步准备做什么？"></textarea></div><div class="modal-footer"><button class="button secondary" id="cancelBtn" type="button">取消</button><button class="button primary" type="submit">保存日报</button></div></form>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (()=>{
      const STORAGE_KEY='daily-report-manager-v1';
      const $=id=>document.getElementById(id);
      let reports=loadReports();
      const localDate=(date=new Date())=>{const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');return `${y}-${m}-${d}`};
      function loadReports(){try{const value=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(value)?value:[]}catch{return []}}
      function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(reports));render()}
      function escapeHtml(value=''){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
      function startOfWeek(date){const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
      function render(){
        const weekStart=localDate(startOfWeek(new Date()));
        $('totalCount').textContent=reports.length;
        $('weekCount').textContent=reports.filter(r=>r.status==='submitted'&&r.date>=weekStart&&r.date<=localDate()).length;
        const submitted=reports.filter(r=>r.status==='submitted').sort((a,b)=>b.date.localeCompare(a.date));
        $('latestDate').textContent=submitted[0]?.date||'—';
        const query=$('searchInput').value.trim().toLowerCase(),status=$('statusFilter').value,date=$('dateFilter').value;
        const filtered=reports.filter(r=>(status==='all'||r.status===status)&&(!date||r.date===date)&&(!query||`${r.title} ${r.content} ${r.plan}`.toLowerCase().includes(query))).sort((a,b)=>b.date.localeCompare(a.date)||b.updatedAt-a.updatedAt);
        $('reportRows').innerHTML=filtered.map(r=>`<tr><td><div class="report-title">${escapeHtml(r.title)}</div><div class="report-preview">${escapeHtml(r.content)}</div></td><td class="date-cell">${escapeHtml(r.date)}</td><td><span class="tag ${r.status==='submitted'?'submitted':''}">${r.status==='submitted'?'已提交':'草稿'}</span></td><td><div class="row-actions"><button class="text-button" data-action="edit" data-id="${escapeHtml(r.id)}">编辑</button><button class="text-button delete" data-action="delete" data-id="${escapeHtml(r.id)}">删除</button></div></td></tr>`).join('');
        $('emptyState').hidden=filtered.length>0;
      }
      function openModal(report){$('reportForm').reset();$('reportId').value=report?.id||'';$('modalTitle').textContent=report?'编辑日报':'新建日报';$('titleInput').value=report?.title||'';$('dateInput').value=report?.date||localDate();$('statusInput').value=report?.status||'submitted';$('contentInput').value=report?.content||'';$('planInput').value=report?.plan||'';$('modalBackdrop').classList.add('open');$('titleInput').focus()}
      function closeModal(){$('modalBackdrop').classList.remove('open')}
      let toastTimer;function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
      $('newBtn').addEventListener('click',()=>openModal());$('closeModal').addEventListener('click',closeModal);$('cancelBtn').addEventListener('click',closeModal);
      $('modalBackdrop').addEventListener('click',event=>{if(event.target===$('modalBackdrop'))closeModal()});
      $('reportForm').addEventListener('submit',event=>{event.preventDefault();const id=$('reportId').value;const existing=reports.find(r=>r.id===id);const report={id:id||`${Date.now()}-${Math.random().toString(36).slice(2,8)}`,title:$('titleInput').value.trim(),date:$('dateInput').value,status:$('statusInput').value,content:$('contentInput').value.trim(),plan:$('planInput').value.trim(),updatedAt:Date.now()};if(existing)reports=reports.map(r=>r.id===id?report:r);else reports.push(report);persist();closeModal();toast(existing?'日报已更新':'日报已保存')});
      $('reportRows').addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button)return;const report=reports.find(r=>r.id===button.dataset.id);if(!report)return;if(button.dataset.action==='edit')openModal(report);else if(confirm(`确定删除「${report.title}」吗？`)){reports=reports.filter(r=>r.id!==report.id);persist();toast('日报已删除')}});
      ['searchInput','statusFilter','dateFilter'].forEach(id=>$(id).addEventListener('input',render));
      $('exportBtn').addEventListener('click',()=>{const blob=new Blob(['\ufeff'+JSON.stringify(reports,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`日报备份-${localDate()}.json`;link.click();URL.revokeObjectURL(url);toast('日报数据已导出')});
      document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal()});render();
    })();
  </script>
</body>
</html>
